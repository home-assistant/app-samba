---
# yamllint disable rule:comments rule:line-length rule:truthy
name: Deploy

on:
  push:
    branches:
      - main
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  ci:
    permissions:
      contents: read
      security-events: write
    uses: home-assistant/workflows/.github/workflows/app-ci.yaml@060f22808cea73e58d750001adae1fd02077ec78 # v0.1.2

  deploy:
    needs: ci
    permissions:
      contents: read
      id-token: write
      packages: write
    uses: home-assistant/workflows/.github/workflows/app-deploy.yaml@060f22808cea73e58d750001adae1fd02077ec78 # v0.1.2
    with:
      repository: apps
      repository_edge: "apps-dev"
    secrets:
      DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
