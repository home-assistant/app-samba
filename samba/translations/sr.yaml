---
configuration:
  username:
    name: Корисничко име
    description: >-
      Корисничко име које желите да користите за аутентификацију на Samba серверу.
  password:
    name: Лозинка
    description: >-
      Лозинка која одговара корисничком имену подешеном за аутентификацију.
  workgroup:
    name: Радна група (Workgroup)
    description: Промените WORKGROUP у складу са потребама ваше мреже.
  enabled_shares:
    name: Омогућене дељене фасцикле
    description: >-
      Листа дељених фасцикли које треба учинити доступним.
      Додавање дељене фасцикле захтева унос њеног назива.
      Дозвољене вредности су local_apps, app_configs, backup, config, media,
      share или ssl.
      Стари називи addons и addon_configs се и даље прихватају и мапирају на
      local_apps и app_configs ради повратне компатибилности.
      Дозвољене су искључиво ове вредности;
      конфигурација се не може сачувати ако се на листи налази било која друга вредност.
  compatibility_mode:
    name: Омогући режим компатибилности
    description: >-
      Укључите ово да бисте користили старе Samba протоколе у Samba апликацији.
  apple_compatibility_mode:
    name: Омогући подешавања компатибилности за Apple уређаје
    description: >-
      Омогућава Samba подешавања за бољу интероперабилност са Apple
      уређајима. Може изазвати проблеме са системима датотека који не подржавају
      xattr, као што је exFAT.
  netbios:
    name: Омогући NetBIOS преко IP-а
    description: >-
      Омогућава NetBIOS преко IP-а за застареле SMB клијенте (Windows 95/98/ME,
      Windows NT, Windows 2000, Windows XP и LanManager клијенте). Онемогућите
      ради боље безбедности и перформанси ако немате застареле SMB клијенте.
  local_master:
    name: Локални главни прегледач
    description: >-
      Када је NetBIOS омогућен, покушава да постане локални главни прегледач
      (local master browser) на подмрежи.
  network_discovery:
    name: Омогући откривање мреже
    description: >-
      Оглашава хост путем Web Services Dynamic Discovery протокола како би се
      аутоматски појавио под Мрежа у Windows File Explorer-у. Онемогућите ако се
      повезујете путем имена хоста или IP адресе и не желите да се хост оглашава
      на мрежи. Дељене фасцикле остају доступне у оба случаја.
  server_signing:
    name: Потписивање на серверу
    description: >-
      Подешава захтеве за потписивање порука SMB сервера.
      Погледајте man страницу за smb.conf за више информација.
      Мењајте ово само ако сте сигурни да ваши SMB клијенти то подржавају.
  veto_files:
    name: Забрањене датотеке
    description: Листа датотека које нису ни видљиве ни доступне.
  allow_hosts:
    name: Дозвољени хостови
    description: Листа хостова/мрежа којима је дозвољен приступ дељеним фасциклама.
